
services:
  # ==========================
  # FASTAPI BACKEND
  # ==========================
  api:
    build: ./backend
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./backend/app:/app/app
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kafka
    restart: unless-stopped

  # ==========================
  # REACT FRONTEND
  # ==========================
  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - web_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    restart: unless-stopped

  # ==========================
  # APACHE KAFKA (KRaft Mode)
  # ==========================
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped


  outbox-publisher:
    build: ./backend
    command: python -m app.outbox_publisher
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./backend/app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kafka
    restart: unless-stopped
  order-consumer:
    build: ./backend
    command: python -m app.order_consumer
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./backend/app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kafka
    restart: unless-stopped
  
  spark:
    build:
      context: ./backend/spark
      dockerfile: Dockerfile
    image: apache/spark:3.5.7
    profiles:
      - analytics
    user: root
    environment:
      HOME: /tmp
      SPARK_LOCAL_IP: 127.0.0.1
      DATABASE_URL: "${DATABASE_URL}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/spark/jobs:/opt/spark/jobs
      - spark_ivy_cache:/opt/spark/.ivy2
      - spark_checkpoints:/opt/spark/checkpoints
    depends_on:
      - kafka
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --conf
      - spark.jars.ivy=/opt/spark/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7
      - /opt/spark/jobs/order_stream.py
    restart: unless-stopped
# ======================
# PERSISTENT VOLUMES
# ==========================
volumes:
  web_modules:
  kafka_data:
  spark_ivy_cache:
  spark_checkpoints:
  


